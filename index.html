*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Figtree','Segoe UI',Arial,sans-serif;min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#fff;color:#33475d}
.l{background:linear-gradient(150deg,#0a1d2e,#0e2841 55%,#0d3a5c);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.l::after{content:"";position:absolute;right:-140px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(0,163,217,.45),transparent 70%)}
.l img{height:58px;width:auto;position:relative;align-self:flex-start}
.l .pn{margin-top:34px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#00a3d9;font-weight:800;position:relative}
.l h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:8px;position:relative}
.l p{color:#bcd0e2;max-width:46ch;margin-top:12px;position:relative;line-height:1.55}
.r{display:flex;align-items:center;justify-content:center;padding:40px}
form{width:min(380px,100%)}
form h2{font-size:26px;font-weight:800;color:#0b2233;letter-spacing:-.02em}
form .sub{color:#6a7d90;margin:6px 0 26px}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#00a3d9;margin:14px 0 6px}
.in{display:flex;align-items:center;border:1px solid #dfe7ef;border-radius:12px;background:#f7fafc;padding:0 12px}
.in:focus-within{border-color:#00a3d9;box-shadow:0 0 0 3px #bfe3f3}
.in input{flex:1;border:0;background:transparent;padding:13px 4px;font:inherit;font-size:14.5px;color:#0b2233;outline:none}
.in button{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:#00a3d9}
.go{width:100%;margin-top:22px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(90deg,#0e2841,#0d3a5c);cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.err{color:#c0483a;font-weight:700;font-size:13px;min-height:20px;margin-top:12px}
.foot{margin-top:26px;font-size:12px;color:#8a9bab;text-align:center}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:820px){body{grid-template-columns:1fr}.l{padding:32px 24px}.l h1{font-size:26px}}
</style>

const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const e64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const enc = new TextEncoder(), dec = new TextDecoder();
async function sha(t){return [...new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');}
async function abre(chaveRaw, sessao){
  const k = await crypto.subtle.importKey('raw', chaveRaw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name: 'AES-GCM', iv: d64(IV)}, k, d64(CORPO));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  try{sessionStorage.setItem('cbc_sessao', JSON.stringify(sessao)); sessionStorage.setItem('cbc_k', JSON.stringify({k: e64(chaveRaw), s: sessao}));}catch(e){}
  document.open(); document.write(html); document.close();
}
async function entrar(u, p){
  u = u.trim().toLowerCase();
  const id = (await sha('cbc|' + u)).slice(0, 24), x = PORTAS.find(z => z.id === id);
  if (!x) throw new Error('nao');
  const base = await crypto.subtle.importKey('raw', enc.encode(u + '|' + p), 'PBKDF2', false, ['deriveKey']);
  const kp = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: d64(x.s), iterations: ITER, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const chave = await crypto.subtle.decrypt({name: 'AES-GCM', iv: d64(x.iv)}, kp, d64(x.c));
  const kc = await crypto.subtle.importKey('raw', chave, 'AES-GCM', false, ['decrypt']);
  const quem = JSON.parse(dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: d64(x.iv)}, kc, d64(x.n))));
  await abre(new Uint8Array(chave), {u: quem.u, nome: quem.nome, exp: Date.now() + 12 * 36e5});
}
document.getElementById('ver').onclick = () => {const p = document.getElementById('p'); p.type = p.type === 'password' ? 'text' : 'password'; document.getElementById('ver').textContent = p.type === 'password' ? 'mostrar' : 'ocultar';};
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; go.textContent = 'Abrindo…'; err.textContent = '';
  try{await entrar(document.getElementById('u').value, document.getElementById('p').value);}
  catch(x){err.textContent = 'E-mail ou senha incorretos.'; const f = document.getElementById('f'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); go.disabled = false; go.textContent = 'Entrar';}
});
(async () => {  // já entrou nesta aba: abre direto (vale 12 h ou até clicar em Sair)
  try{const s = JSON.parse(sessionStorage.getItem('cbc_k')); if (s && s.s.exp > Date.now()) return await abre(d64(s.k), s.s);}catch(e){}
  document.getElementById('u').focus();
})();
</script>
